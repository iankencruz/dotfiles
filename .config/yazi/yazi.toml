[opener]
system_default = [
    { run = 'xdg-open "$1"', desc = "System Default", for = "linux" }
]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Edit with Neovim" }
]
open = [
    { run = 'xdg-open "$@"', desc = "Open" }
]
imv = [
    { run = 'imv "$@"', block = true, desc = "imv" }
]

[open]
rules = [
    { url = "*.lua", use = [ "edit" ] },
    { mime = "text/*", use = [ "edit" ] },
    { mime = "application/pdf", use = [ "system_default" ] },
    { mime = "image/*", use = [ "imv", "system_default" ] },
    { mime = "{audio,video}/*", use = [ "system_default" ] }
]

[mgr]
show_hidden = true

[plugin]
prepend_previewers = [
    { mime = "image/*", run = "imv-preview" }
]
